<body class="note-popout-body">
    <div id="popout-status" class="note-popout-status" hidden></div>
    <div id="popout-root" class="note-popout-root" aria-label="Popout note"></div>

    <div id="media-staging-overlay" class="overlay media-staging-overlay is-hidden" role="dialog" aria-modal="true" aria-label="Add to media library">
        <div class="media-staging-panel">
            <div class="media-staging-panel__header">
                <div class="media-staging-panel__heading">
                    <h2 class="media-staging-panel__title">Add to media library</h2>
                    <p class="media-staging-panel__subtitle is-hidden" data-media-staging-target></p>
                </div>
                <span data-media-staging-count class="sidebar-media-lib__compact">0</span>
                <button type="button" class="card-act media-staging-panel__close" data-media-staging-cancel title="Cancel" aria-label="Cancel"></button>
            </div>
            <div class="media-staging-panel__body" data-media-staging-body></div>
            <div class="media-staging-panel__footer">
                <button type="button" class="btn btn--compact" data-media-staging-cancel>Cancel</button>
                <button type="button" class="btn btn--compact" data-media-staging-confirm>Add to library</button>
            </div>
        </div>
    </div>

    <input type="file" id="media-library-file-picker" class="is-hidden" multiple>
    <input type="file" id="media-meta-import-picker" class="is-hidden" accept=".json,application/json">
    <input type="file" id="media-zip-import-picker" class="is-hidden" accept=".zip,application/zip">

    <div id="media-library-panel" class="media-lib-panel is-hidden" role="dialog" aria-label="Media library">
        <div class="media-lib-panel__top-actions">
            <span class="media-lib-panel__sort" role="group" aria-label="Sort media" data-media-lib-sort-group>
                <button type="button" class="card-act media-lib-sort-btn" data-media-lib-sort="date" title="Sort by date" aria-label="Sort by date" aria-pressed="false"></button>
                <button type="button" class="card-act media-lib-sort-btn" data-media-lib-sort="alpha" title="Sort alphabetically" aria-label="Sort alphabetically" aria-pressed="false"></button>
            </span>
            <button type="button" class="card-act media-lib-view-btn media-lib-panel__view-toggle" data-media-lib-view-toggle title="Tiles view" aria-label="Tiles view" aria-pressed="true"></button>
            <span class="media-lib-panel__drag card-act card-act--drag" data-media-lib-drag title="Drag to move" aria-label="Drag to move"></span>
            <button type="button" class="card-act media-lib-panel__close" data-media-lib-close title="Close" aria-label="Close"></button>
        </div>
        <div class="media-lib-panel__header" data-media-lib-header></div>
        <div class="media-lib-attach-chip is-hidden" data-media-attach-chip></div>
        <div class="media-lib-panel__body">
            <div class="media-lib-drop" data-media-lib-drop>
                <p class="media-lib-empty is-hidden" data-media-lib-empty>No media yet. Upload, paste (Ctrl+V), or drop files here.</p>
                <div class="media-lib-grid" data-media-lib-grid></div>
                <p class="media-lib-drop-hint is-hidden" data-media-lib-drop-hint>Drop files here to add</p>
            </div>
            <div class="media-lib-detail" data-media-lib-detail></div>
        </div>
        <div class="media-lib-panel__footer" data-media-lib-footer></div>
    </div>
